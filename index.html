        background: { showBackground: true },
        cookieIcon: { position: "bottomLeft" },
        position: { banner: "center" },
        cookieTypes: [
          {
            id: "necessary",

            onAccept: __stcmNotify
          },
          {
            id: "functional",
            name: "Functional",
            description: "<p>These cookies remember your server filters, list or grid view, sort order and dismissed notices for your next visit. They also enable the MineTalk support chat, which shares the pages you visit and basic device details with MineTalk so we can help you. The site still works without them, but your preferences will not be saved and the support chat will not be available.</p>",
            required: false,
            onAccept: __stcmNotify,
            onReject: __stcmNotify
          },
          {
            id: "analytics",
            name: "Analytics",
            description: "<p>These cookies let us measure how the site is used and detect crashes and performance problems. We use Sentry (errors, session replays of broken pages), Google Analytics (aggregate usage via Google Tag Manager) and Microsoft Clarity (session replays for UX research). We use this data only to fix bugs and improve the site. We do not sell it or share it with advertisers.</p>",
            required: false,
            onAccept: __stcmNotify,
            onReject: __stcmNotify
          },
          {
            id: "advertising",
            name: "Personalised ads",
            description: "<p>Ads are shown either way. With this on, Google may use cookies to choose ads based on your earlier visits to this site and to other websites. With it off, ads are based only on the page you are viewing and your approximate location.</p>",
            required: false,
            onAccept: __stcmNotify,
            onReject: __stcmNotify
          }
        ],
        text: {
          banner: {
            description: "<p>We use cookies to keep your filters and language, and Google AdSense uses them for the ads that pay for our servers. With your consent, we also use them for the support chat (MineTalk), to measure how the site is used and to detect crashes (Sentry, Google Analytics, Microsoft Clarity), and to personalise ads. We do not sell your data. The <a href=\"/privacy\">privacy policy</a> has the details.</p>",
            acceptAllButtonText: "Accept all",

          },

        }
